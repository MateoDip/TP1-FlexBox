<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción - El Cronista Global</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
    <script defer src="js/validations.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="header-top">
            <span class="date">Martes, 26 de Mayo de 2026</span>
            <h1 class="logo">El Cronista Global</h1>
            <span class="location">Rosario, Argentina</span>
        </div>
        
        <nav class="navbar">
            <div class="menu-toggle" aria-label="Abrir menú">☰</div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Política</a></li>
                <li><a href="#">Economía</a></li>
                <li><a href="subscription.html">Suscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="main-subscription">
            <h1 id="form-title">HOLA</h1>
            
            <form id="subscription-form">
                <div class="form-group">
                    <label for="fullname">Nombre completo:</label>
                    <input type="text" id="fullname" name="fullname">
                    <span class="error-msg" id="err-fullname"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                    <span class="error-msg" id="err-email"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password">
                    <span class="error-msg" id="err-password"></span>
                </div>

                <div class="form-group">
                    <label for="rep-password">Repetir contraseña:</label>
                    <input type="password" id="rep-password" name="rep-password">
                    <span class="error-msg" id="err-rep-password"></span>
                </div>

                <div class="form-group">
                    <label for="age">Edad:</label>
                    <input type="number" id="age" name="age">
                    <span class="error-msg" id="err-age"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono:</label>
                    <input type="text" id="phone" name="phone">
                    <span class="error-msg" id="err-phone"></span>
                </div>

                <div class="form-group">
                    <label for="address">Dirección:</label>
                    <input type="text" id="address" name="address">
                    <span class="error-msg" id="err-address"></span>
                </div>

                <div class="form-group">
                    <label for="city">Ciudad:</label>
                    <input type="text" id="city" name="city">
                    <span class="error-msg" id="err-city"></span>
                </div>

                <div class="form-group">
                    <label for="zipcode">Código Postal:</label>
                    <input type="text" id="zipcode" name="zipcode">
                    <span class="error-msg" id="err-zipcode"></span>
                </div>

                <div class="form-group">
                    <label for="dni">DNI:</label>
                    <input type="text" id="dni" name="dni">
                    <span class="error-msg" id="err-dni"></span>
                </div>

                <div class="form-submit">
                    <button type="submit" id="submit-btn">Enviar Suscripción</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 El Cronista Global. Todos los derechos reservados.</p>
        <p>Inspirado en coberturas deportivas de CNN en Español.</p>
    </footer>

</body>
</html>
