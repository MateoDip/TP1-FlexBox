<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción - Diario Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
    <script defer src="js/validations.js"></script>
</head>
<body>
    <header>
        <h1><a href="index.html">El Diario Online</a></h1> </header>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li> </ul>
        </nav>
    <main class="main-subscription">
        <h1 id="form-title">HOLA</h1>
        
        <form id="subscription-form">
            <div class="form-group">
                <label for="fullname">Nombre completo:</label>
                <input type="text" id="fullname" name="fullname">
                <span class="error-msg" id="err-fullname"></span>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email">
                <span class="error-msg" id="err-email"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
                <span class="error-msg" id="err-password"></span>
            </div>

            <div class="form-group">
                <label for="rep-password">Repetir contraseña:</label>
                <input type="password" id="rep-password" name="rep-password">
                <span class="error-msg" id="err-rep-password"></span>
            </div>

            <div class="form-group">
                <label for="age">Edad:</label>
                <input type="number" id="age" name="age">
                <span class="error-msg" id="err-age"></span>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono:</label>
                <input type="text" id="phone" name="phone">
                <span class="error-msg" id="err-phone"></span>
            </div>

            <div class="form-group">
                <label for="address">Dirección:</label>
                <input type="text" id="address" name="address">
                <span class="error-msg" id="err-address"></span>
            </div>

            <div class="form-group">
                <label for="city">Ciudad:</label>
                <input type="text" id="city" name="city">
                <span class="error-msg" id="err-city"></span>
            </div>

            <div class="form-group">
                <label for="zipcode">Código Postal:</label>
                <input type="text" id="zipcode" name="zipcode">
                <span class="error-msg" id="err-zipcode"></span>
            </div>

            <div class="form-group">
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni">
                <span class="error-msg" id="err-dni"></span>
            </div>

            <div class="form-submit">
                <button type="submit" id="submit-btn">Enviar</button>
            </div>
        </form>
    </main>

    </body>
</html>
